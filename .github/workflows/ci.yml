name: PHP docker CI

on:
  push:
    branches:
      - main
    paths:
      - 'lab9/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'lab9/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  DB_HOST: db
  DB_NAME: test_db
  DB_USER: test_user
  DB_PASSWORD: test_pass
  APP_URL: http://web

defaults:
  run:
    working-directory: lab9/nginx-lab

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Lint PHP files
        run: find www tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Create .env.test
        run: |
          printf 'DB_HOST=%s\nDB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nAPP_URL=%s\n' \
            "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$APP_URL" > .env.test
          cat .env.test

      - name: Build images
        run: docker compose build

      - name: Install dependencies
        run: docker compose run --rm -T --no-deps tests composer install --no-interaction --no-progress

      - name: Start docker
        run: docker compose up -d web php db

      - name: Wait for services
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T db mysql -h127.0.0.1 -utest_user -ptest_pass test_db -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MySQL готов"
              exit 0
            fi
            echo "Ждём MySQL ($i/40)..."
            sleep 3
          done
          echo "MySQL не поднялся вовремя"
          exit 1

      - name: Check containers
        run: docker ps

      - name: Run tests
        run: docker compose run --rm -T tests vendor/bin/phpunit --testdox --fail-on-skipped

      - name: Show logs on error
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v