name: lab9

services:
  web:
    image: nginx:1.27-alpine
    container_name: lab9_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    container_name: lab9_php
    volumes:
      - ./www:/usr/share/nginx/html
    expose:
      - "9000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lab9_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lab5_db
      MYSQL_USER: lab5_user
      MYSQL_PASSWORD: lab5_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer
    container_name: lab9_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  tests:
    build: .
    container_name: lab9_tests
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - web
      - db
    command: vendor/bin/phpunit
    profiles: ["test"]

volumes:
  db_data: