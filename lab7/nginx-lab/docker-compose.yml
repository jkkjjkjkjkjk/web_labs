name: lab7

services:
  web:
    image: nginx:1.27-alpine
    container_name: lab7_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    container_name: lab7_php
    volumes:
      - ./www:/usr/share/nginx/html
    expose:
      - "9000"
    depends_on:
      - rabbitmq
      - kafka
      - db

  # Worker RabbitMQ (основная задача варианта 18)
  worker:
    build: .
    container_name: lab7_worker
    command: php worker.php
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html
    depends_on:
      - rabbitmq
      - db

  # Worker Kafka (штрафное)
  worker_kafka:
    build: .
    container_name: lab7_worker_kafka
    command: php worker_kafka.php
    restart: unless-stopped
    volumes:
      - ./www:/usr/share/nginx/html
    depends_on:
      - kafka

  rabbitmq:
    image: rabbitmq:3-management
    container_name: lab7_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

  kafka:
    image: apache/kafka:3.8.0
    container_name: lab7_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  db:
    image: mysql:8.0
    container_name: lab7_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lab5_db
      MYSQL_USER: lab5_user
      MYSQL_PASSWORD: lab5_pass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: