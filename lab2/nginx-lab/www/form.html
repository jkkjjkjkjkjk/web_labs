<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на ремонт техники</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            opacity: 0;
            animation: fadeIn 1.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 20px;
            font-size: 22px;
            text-align: center;
            color: #2c3e50;
        }

        label.field {
            display: block;
            margin-bottom: 14px;
            font-size: 14px;
            color: #34495e;
        }

        input[type="text"],
        select {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            font-size: 15px;
            background: #f5f8fc;
            border: 2px solid #c5d0de;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            background: #ffffff;
            border-color: #3498db;
        }

        fieldset {
            margin: 0 0 14px;
            padding: 10px 12px;
            border: 2px solid #c5d0de;
            border-radius: 6px;
            background: #f5f8fc;
            transition: border-color 0.3s;
        }

        legend {
            padding: 0 6px;
            font-size: 14px;
            color: #34495e;
        }

        .option {
            display: block;
            margin: 6px 0;
            font-size: 14px;
            cursor: pointer;
        }

        .checkbox-row { margin-bottom: 18px; }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #ffffff;
            background: #3498db;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.4s ease, transform 0.2s ease;
        }

        button:hover {
            background: #27ae60;
            transform: translateY(-1px);
        }

        .highlight {
            border-color: #e74c3c !important;
            background: #fdecea !important;
            animation: pulse 1s ease 2;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
            50%      { box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.35); }
        }

        #result {
            margin-top: 20px;
            padding: 0;
            font-size: 14px;
            color: #2c3e50;
        }

        #result.filled {
            padding: 14px;
            background: #eafaf1;
            border-left: 4px solid #27ae60;
            border-radius: 6px;
        }

        #result p { margin: 4px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Заявка на ремонт техники</h1>

        <form id="myForm" novalidate>
            <label class="field">
                Ваше имя
                <input type="text" name="username" placeholder="Введите имя">
            </label>

            <label class="field">
                Модель устройства
                <input type="text" name="model" placeholder="Например, IPhone 16>
            </label>

            <label class="field">
                Услуга
                <select name="service">
                    <option value="">— выберите услугу —</option>
                    <option value="Диагностика">Диагностика</option>
                    <option value="Замена экрана">Замена экрана</option>
                    <option value="Замена аккумулятора">Замена аккумулятора</option>
                    <option value="Чистка от пыли">Чистка от пыли</option>
                    <option value="Ремонт материнской платы">Ремонт материнской платы</option>
                </select>
            </label>

            <div class="checkbox-row">
                <label class="option">
                    <input type="checkbox" name="warranty"> Гарантия есть
                </label>
            </div>

            <fieldset id="termGroup">
                <legend>Срок ремонта</legend>
                <label class="option">
                    <input type="radio" name="term" value="Срочный (1 день)"> Срочный (1 день)
                </label>
                <label class="option">
                    <input type="radio" name="term" value="Обычный (3-5 дней)"> Обычный (3-5 дней)
                </label>
                <label class="option">
                    <input type="radio" name="term" value="Без спешки (до 2 недель)"> Без спешки (до 2 недель)
                </label>
            </fieldset>

            <button type="submit">Отправить</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById("myForm");
        const resultBox = document.getElementById("result");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            clearHighlights();

            const username = this.username.value.trim();
            const model = this.model.value.trim();
            const service = this.service.value;
            const warranty = this.warranty.checked;
            const termInput = this.querySelector('input[name="term"]:checked');

            // Проверка: подсвечиваем незаполненные поля
            let hasErrors = false;
            if (!username) { this.username.classList.add("highlight"); hasErrors = true; }
            if (!model)    { this.model.classList.add("highlight");    hasErrors = true; }
            if (!service)  { this.service.classList.add("highlight");  hasErrors = true; }
            if (!termInput) {
                document.getElementById("termGroup").classList.add("highlight");
                hasErrors = true;
            }

            if (hasErrors) {
                resultBox.className = "";
                resultBox.textContent = "";
                alert("Пожалуйста, заполните все поля формы!");
                return;
            }

            const rows = [
                ["Имя", username],
                ["Модель", model],
                ["Услуга", service],
                ["Гарантия", warranty ? "есть" : "нет"],
                ["Срок ремонта", termInput.value]
            ];

            resultBox.innerHTML = "";
            rows.forEach(([label, value]) => {
                const p = document.createElement("p");
                const b = document.createElement("b");
                b.textContent = label + ": ";
                p.appendChild(b);
                p.appendChild(document.createTextNode(value));
                resultBox.appendChild(p);
            });
            resultBox.className = "filled";

            stopReminder();
        });

        function clearHighlights() {
            form.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
        }

        form.addEventListener("input", function (e) {
            e.target.classList.remove("highlight");
            const group = e.target.closest("fieldset");
            if (group) group.classList.remove("highlight");
        });

        const REMINDER_DELAY = 15000;
        let reminderTimer = null;

        function startReminder() {
            clearTimeout(reminderTimer);
            reminderTimer = setTimeout(showReminder, REMINDER_DELAY);
        }

        function stopReminder() {
            clearTimeout(reminderTimer);
            reminderTimer = null;
            ["input", "change", "keydown", "click", "focusin"].forEach(evt => {
                form.removeEventListener(evt, startReminder);
            });
        }

        function showReminder() {
            if (!form.username.value.trim()) form.username.classList.add("highlight");
            if (!form.model.value.trim())    form.model.classList.add("highlight");
            if (!form.service.value)         form.service.classList.add("highlight");
            if (!form.querySelector('input[name="term"]:checked')) {
                document.getElementById("termGroup").classList.add("highlight");
            }
            alert("Пожалуйста, заполните форму!");
        }

        ["input", "change", "keydown", "click", "focusin"].forEach(evt => {
            form.addEventListener(evt, startReminder);
        });

        startReminder();
    </script>
</body>
</html>
