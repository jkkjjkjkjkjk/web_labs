services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    container_name: lab6_php
    volumes:
      - ./www:/usr/share/nginx/html
    expose:
      - "9000"
    depends_on:
      - redis
      - clickhouse

  redis:
    image: redis:7
    container_name: lab6_redis
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: lab6_clickhouse
    environment:
      CLICKHOUSE_DB: lab6
      CLICKHOUSE_USER: lab6_user
      CLICKHOUSE_PASSWORD: lab6_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - ch_data:/var/lib/clickhouse

volumes:
  ch_data: